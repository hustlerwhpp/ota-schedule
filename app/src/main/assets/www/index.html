    <script>
        (function () {
            var b = document.getElementById("themeToggle");
            if (b) {
                var s = b.querySelector("span");
                function isDark() {
                    var t = document.documentElement.getAttribute("data-theme");
                    if (t === "dark") return true;
                    if (t === "light") return false;
                    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                }
                function render() {
                    var txt = isDark() ? "Включить светлую тему" : "Включить тёмную тему";
                    if (s) { s.textContent = txt; } else { b.textContent = txt; }
                }
                b.addEventListener("click", function () {
                    var n = isDark() ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", n);
                    try { localStorage.setItem("whpp-rasp-theme", n); } catch (e) {}
                    render();
                });
                render();
            }

            var menu = document.getElementById("settingsMenu");
            var backdrop = document.getElementById("settingsBackdrop");
            var openBtns = [document.getElementById("headerSettingsBtn"), document.getElementById("tabSettingsBtn")].filter(Boolean);
            var closeBtn = document.getElementById("settingsCloseBtn");

            function setOpen(open) {
                if (!menu || !backdrop) return;
                menu.classList.toggle("open", open);
                backdrop.classList.toggle("open", open);
                menu.setAttribute("aria-hidden", open ? "false" : "true");
                backdrop.setAttribute("aria-hidden", open ? "false" : "true");
                openBtns.forEach(function (btn) { btn.setAttribute("aria-expanded", open ? "true" : "false"); });
            }

            openBtns.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    setOpen(!menu.classList.contains("open"));
                });
            });
            if (closeBtn) closeBtn.addEventListener("click", function () { setOpen(false); });
            if (backdrop) backdrop.addEventListener("click", function () { setOpen(false); });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && menu && menu.classList.contains("open")) setOpen(false);
            });
        })();
    </script>
